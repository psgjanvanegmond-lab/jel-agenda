name: Diagnose verbinding (tijdelijk)
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for h in outlook.office365.com outlook.office.com outlook.live.com www.microsoft.com github.com; do
            echo "== $h"; getent ahosts $h | head -3
            curl -s -o /dev/null -w "ipv4: %{http_code} in %{time_total}s\n" --ipv4 --connect-timeout 10 https://$h/ || echo "ipv4: MISLUKT ($?)"
          done
