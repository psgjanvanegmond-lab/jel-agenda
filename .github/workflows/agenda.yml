name: Agenda bijwerken

# De agenda komt van Power Automate (stroom "JEL agenda naar website" in Microsoft 365):
# die leest om 12:00 en 18:00 de Outlook-agenda "JEL agenda website" en stuurt de afspraken
# hierheen als seintje "agenda" (repository dispatch). Deze taak maakt er agenda.json van
# en zet die op GitHub Pages.
#
# Direct bijwerken na een wijziging in Outlook: start de stroom in Power Automate (Uitvoeren).
# "Run workflow" hieronder zet alleen de bestaande agenda opnieuw online.
#
# (Vroeger haalde deze taak de ICS-link zelf op via het tussenstation op Render, map proxy/.
#  Microsoft weigert sinds november 2026 ook dat verkeer; daarom nu via Power Automate.)
on:
  repository_dispatch:
    types: [agenda]
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: agenda
  cancel-in-progress: false

jobs:
  bijwerken:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Code ophalen
        uses: actions/checkout@v5

      # De afspraken gaan via een bestand, nooit naar het logboek (dit is een openbare opslagplaats).
      - name: Afspraken van Power Automate omzetten
        if: github.event_name == 'repository_dispatch'
        env:
          AFSPRAKEN: ${{ toJSON(github.event.client_payload) }}
        run: |
          printf '%s' "$AFSPRAKEN" > "$RUNNER_TEMP/afspraken.json"
          python3 build/outlook-naar-ics.py "$RUNNER_TEMP/afspraken.json" "$RUNNER_TEMP/agenda.ics"

      - name: agenda.json maken
        if: github.event_name == 'repository_dispatch'
        run: php build/build.php "$RUNNER_TEMP/agenda.ics" docs/agenda.json

      - name: Opslaan als de agenda veranderd is
        id: save
        run: |
          git config user.name "agenda-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "Geen wijzigingen."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Agenda bijgewerkt"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Pages voorbereiden
        if: steps.save.outputs.changed == 'true' || github.event_name != 'repository_dispatch'
        uses: actions/configure-pages@v5

      - name: Bestanden klaarzetten
        if: steps.save.outputs.changed == 'true' || github.event_name != 'repository_dispatch'
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

      # GitHub heeft soms een paar seconden nodig voordat het geüploade bestand vindbaar is.
      - name: Even wachten
        if: steps.save.outputs.changed == 'true' || github.event_name != 'repository_dispatch'
        run: sleep 15

      - name: Publiceren op GitHub Pages
        id: deploy
        if: steps.save.outputs.changed == 'true' || github.event_name != 'repository_dispatch'
        uses: actions/deploy-pages@v4
