name: Agenda bijwerken

# Haalt de Outlook-agenda op en zet die op GitHub Pages:
# - automatisch om 12:00 en 18:00 Nederlandse tijd;
# - handmatig met de knop "Run workflow" (Actions → Agenda bijwerken).
#
# GitHub rekent in UTC-tijd. Daarom staan er vier tijden ingepland (voor winter- en zomertijd);
# de eerste taak hieronder laat alleen de runs om 12 en 18 uur Nederlandse tijd doorgaan.
on:
  schedule:
    - cron: "5 10,11,16,17 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: agenda
  cancel-in-progress: false

jobs:
  tijdcontrole:
    runs-on: ubuntu-latest
    outputs:
      doorgaan: ${{ steps.check.outputs.doorgaan }}
    steps:
      - id: check
        run: |
          uur=$(TZ=Europe/Amsterdam date +%H)
          if [ "${{ github.event_name }}" != "schedule" ] || [ "$uur" = "12" ] || [ "$uur" = "18" ]; then
            echo "doorgaan=true" >> "$GITHUB_OUTPUT"
          else
            echo "Het is nu $uur uur in Nederland; deze geplande run wordt overgeslagen."
            echo "doorgaan=false" >> "$GITHUB_OUTPUT"
          fi

  bijwerken:
    needs: tijdcontrole
    if: needs.tijdcontrole.outputs.doorgaan == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Code ophalen
        uses: actions/checkout@v5

      # Microsoft blokkeert verkeer van GitHub naar Outlook. Daarom wordt de agenda opgehaald
      # via het tussenstation op Render (map proxy/). Dat kan na een rustige periode tot
      # een minuut nodig hebben om wakker te worden; vandaar de ruime wachttijd.
      - name: Agenda ophalen (via Render)
        env:
          PROXY_URL: ${{ vars.JEL_PROXY_URL || 'https://jel-agenda-proxy.onrender.com' }}
        run: |
          curl -fsS -o /dev/null --max-time 120 --retry 2 --retry-delay 20 --retry-all-errors "${PROXY_URL%/}/health" || true
          curl -fsSL --connect-timeout 30 --max-time 150 --retry 3 --retry-delay 20 --retry-all-errors \
            "${PROXY_URL%/}/agenda.ics" -o "$RUNNER_TEMP/agenda.ics"

      - name: agenda.json maken
        run: php build/build.php "$RUNNER_TEMP/agenda.ics" docs/agenda.json

      - name: Opslaan als de agenda veranderd is
        id: save
        run: |
          git config user.name "agenda-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # GitHub zet automatische taken uit na 60 dagen zonder wijzigingen; daarom af en toe een teken van leven.
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 45 * 86400 )) ]; then
            date -u +"%Y-%m-%dT%H:%M:%SZ" > docs/.laatst-gecontroleerd
          fi
          git add docs
          if git diff --cached --quiet; then
            echo "Geen wijzigingen."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Agenda bijgewerkt"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Pages voorbereiden
        if: steps.save.outputs.changed == 'true' || github.event_name != 'schedule'
        uses: actions/configure-pages@v5

      - name: Bestanden klaarzetten
        if: steps.save.outputs.changed == 'true' || github.event_name != 'schedule'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Publiceren op GitHub Pages
        id: deploy
        if: steps.save.outputs.changed == 'true' || github.event_name != 'schedule'
        uses: actions/deploy-pages@v4
